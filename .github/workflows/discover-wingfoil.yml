name: Discover Wingfoil Board and Foil Reviews
on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1' # Mondays 07:10 UTC, weekly archive independent of ChatGPT automation
  push:
    branches: [main]
    paths:
      - 'video-analysis/discover.py'
      - 'video-analysis/test_discover.py'
      - '.github/workflows/discover-wingfoil.yml'
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all offline video analysis tests
        run: python -m unittest discover -s video-analysis -p 'test_*.py' -v
      - name: Discover Gleiten.TV wingfoil tests
        run: python video-analysis/discover.py --sources gleiten --max-pages 12 --output video-index/gleiten.json
      - name: Verify YouTube discovery configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY: configured (value hidden)"
          else
            echo "::warning title=YouTube discovery inactive::Add the YOUTUBE_API_KEY GitHub Actions secret to enable actual YouTube search."
          fi
      - name: Discover YouTube reviews (24 months) when configured
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # This run verifies the repository secret at runtime without logging its value.
          python video-analysis/discover.py --sources youtube --youtube-pages 1 --output video-index/youtube.json
      - name: Print inventory and access status (no false success)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('video-index').glob('*.json'):
              d=json.loads(path.read_text())
              print(path.name,'discovered:',d['discovered'],
                    'unconfirmed dates:',d['unknown_or_unconfirmed_dates'],
                    'source status:',d['report'])
          PY
      - name: Publish a readable discovery status summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = sorted(Path('video-index').glob('*.json'))
          lines = [
              '# FOIL LAB — résultat de la collecte vidéo',
              '',
              'Un job GitHub **réussi** signifie que le programme a terminé, pas que des vidéos ont été trouvées.',
              '',
              '| Source | Vidéos découvertes | État |',
              '|---|---:|---|'
          ]
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('report', {})
              if path.stem == 'youtube':
                  detail = status.get('youtube', {}).get('status', 'unknown')
              else:
                  groups = status.get('gleiten', {})
                  errors = sum(len(x.get('errors', [])) for x in groups.values())
                  detail = f'{errors} erreur(s) d’accès' if errors else 'consultation terminée'
              lines.append(f"| {path.stem} | {data.get('discovered', 0)} | {detail} |")
          if not files:
              lines.append('| Aucun rapport | 0 | Aucun inventaire produit |')
          lines.extend(['', 'Les résultats décrivent uniquement des références identifiées ; aucune vidéo n’est réputée visionnée ou transcrite.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wingfoil-24-month-discovery
          path: video-index/*.json
          retention-days: 14

name: Video Analysis Checks
on:
  pull_request:
    paths:
      - 'video-analysis/**'
      - 'index.html'
      - 'progress.html'
      - 'data/**'
      - 'data/research/pilot_3_video_tests_2026-11-15.json'
      - 'data/research/transcript_audit_2026-11-15.json'
      - '.github/workflows/video-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'video-analysis/**'
      - 'index.html'
      - 'progress.html'
      - 'data/**'
      - 'data/research/pilot_3_video_tests_2026-11-15.json'
      - 'data/research/transcript_audit_2026-11-15.json'
      - '.github/workflows/video-analysis.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline transcript parser tests
        run: python -m unittest discover -s video-analysis -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recommendations and catalogue completeness
        run: |
          node video-analysis/test_recommendations.js
          node video-analysis/test_catalogue.js
          node video-analysis/test_evidence_library.js
          node video-analysis/test_site_links.js
          node video-analysis/test_forms.js
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('video-analysis/manifest.json').read_text(encoding='utf-8'))
          assert len({v['id'] for v in x['videos']})==len(x['videos'])
          assert all(not v['full_video_reviewed'] for v in x['videos'])
          assert all(v['transcript_status'] in ('not_available_yet','transcript_reviewed_not_audio_verified') for v in x['videos'])
          print('Manifest OK',len(x['videos']))
          PY

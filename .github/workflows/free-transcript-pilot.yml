name: Free anonymous YouTube transcript pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser, no guessing and errors
        run: python -m unittest discover -s video-analysis -p 'test_*.py' -v
      - name: Attempt 3 real transcripts anonymously without a key
        run: python video-analysis/free_transcript_pilot.py --limit 3 --output video-index/free-transcript-pilot.json
      - name: Report genuine outcome
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('video-index/free-transcript-pilot.json')
          lines=['# FOIL LAB · test gratuit des transcriptions YouTube','']
          if p.exists():
              d=json.loads(p.read_text())
              lines+=['- Vidéos testées : **'+str(d['attempted'])+'**',
                '- Transcriptions réellement reçues : **'+str(d['transcripts_obtained'])+'**',
                '- Segments contenant un mot-clé : **'+str(d['technical_keyword_segments'])+'**',
                '- Candidats conservés : **'+str(d['candidate_count'])+'**',
                '- Candidats omis par plafonnement : **'+str(d['candidates_omitted'])+'**',
                '- Notes du configurateur modifiées : **0**','']
              for v in d['results']:
                  lines.append('- '+v['title']+' : '+v['status']+
                    (' ('+str(v['segment_count'])+' segments de sous-titres; '+str(v['candidate_count'])+' candidats)' if 'segment_count' in v else ''))
              lines+=['', 'Les candidats sont des repères de lecture, pas des conclusions validées.',
                'Les fenêtres de contexte sont référencées par indices et minutages. Le texte intégral reste hors des artefacts publics.',
                'Pour une analyse locale complète : utiliser --cache-dir, puis --input-dir pour retraiter sans réseau.']
          else:
              lines.append('Aucun résultat produit')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-anonymous-foil-video-transcripts
          path: video-index/free-transcript-pilot.json
          if-no-files-found: warn
          retention-days: 7
